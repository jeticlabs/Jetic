<svg class="jl" xmlns="http://www.w3.org/2000/svg" width="20" height="30" viewBox="0 0 14 21" role="img" aria-label="Jetic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
.jl{--j-fill:#fff;--j-hi:#000;--j-hia:.18}
@media(prefers-color-scheme:dark){.jl{--j-fill:#000;--j-hi:#fff;--j-hia:.4}}
.jl-p{fill:var(--j-fill)}
.jl-sg stop{stop-color:var(--j-hi)}
.jl-g{transform-origin:7px 10.5px}
@media(prefers-reduced-motion:reduce){.jl *{animation:none!important}.jl-s{display:none}}
.jl-g{animation:jl-g 4.8s infinite}.jl-a{animation:jl-a 4.8s infinite}.jl-b{animation:jl-b 4.8s infinite}.jl-c{animation:jl-c 4.8s infinite}.jl-s{animation:jl-s 4.8s infinite}
@keyframes jl-g{0%{transform:scale(.94);animation-timing-function:cubic-bezier(.22,1,.36,1)}25%,100%{transform:scale(1)}}
@keyframes jl-a{0%{transform:translateX(-14px);animation-timing-function:cubic-bezier(.22,1,.36,1)}15.625%{transform:translateX(0)}62.5%{transform:translateX(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}76.042%,100%{transform:translateX(14px)}}
@keyframes jl-b{0%,6.25%{transform:translateY(-7.2px);animation-timing-function:cubic-bezier(.22,1,.36,1)}20.833%{transform:translateY(0)}67.708%{transform:translateY(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}81.25%,100%{transform:translateY(7.2px)}}
@keyframes jl-c{0%,12.5%{transform:translateX(14px);animation-timing-function:cubic-bezier(.22,1,.36,1)}28.125%{transform:translateX(0)}72.917%{transform:translateX(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}86.458%,100%{transform:translateX(-14px)}}
@keyframes jl-s{0%,31.25%{transform:translateX(-9px);animation-timing-function:cubic-bezier(.45,0,.25,1)}47.917%,100%{transform:translateX(27px)}}
</style>
  <defs>
    <clipPath id="jl-shape"><path d="M0 0h14v14l-7 7H0v-7h7V7H0V0Z"/></clipPath>
    <clipPath id="jl-ca"><rect x="0" y="-1" width="14" height="9"/></clipPath>
    <clipPath id="jl-cb"><rect x="6" y="6.96" width="9" height="7.08"/></clipPath>
    <clipPath id="jl-cc"><rect x="0" y="13" width="14" height="9"/></clipPath>
    <linearGradient id="jl-sg" class="jl-sg">
      <stop offset="0" stop-opacity="0"/>
      <stop offset=".5" style="stop-opacity:var(--j-hia)"/>
      <stop offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="jl-g">
    <g clip-path="url(#jl-ca)"><path class="jl-p jl-a" d="M0 0H14V7.04H7V7H0Z"/></g>
    <g clip-path="url(#jl-cb)"><path class="jl-p jl-b" d="M7 6.96H14V14.04H7Z"/></g>
    <g clip-path="url(#jl-cc)"><path class="jl-p jl-c" d="M0 14H7V13.96H14V14L7 21H0Z"/></g>
    <g clip-path="url(#jl-shape)"><g class="jl-s"><rect transform="skewX(-20)" x="0" y="-2" width="5" height="25" fill="url(#jl-sg)"/></g></g>
  </g>
</svg>
