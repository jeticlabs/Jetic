<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link id="app-favicon" rel="icon" href="/brand/jetic.svg" type="image/svg+xml" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('jetic_theme') === 'light') {
          document.getElementById('app-favicon').setAttribute('href', '/brand/jetic-black.svg');
        }
      } catch (e) { }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Jetic Studio</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
