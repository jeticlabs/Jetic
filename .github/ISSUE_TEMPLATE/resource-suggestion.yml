name: Resource Suggestion
description: Suggest a developer resource or plugin for the Jetic ecosystem
labels: ["resource"]
body:
  - type: markdown
    attributes:
      value: |
        Know a great resource or plugin for Jetic developers? Suggest it here.
  - type: input
    id: resource-name
    attributes:
      label: Resource Name
      placeholder: e.g. Express AST Extractor Plugin
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - CLI Tools
        - Dashboard Plugins
        - Behavioral Models
        - Integration Guides
        - Open Source
    validations:
      required: true
  - type: textarea
    id: why-useful
    attributes:
      label: Why is this useful?
      description: Brief explanation of why this resource should be included
    validations:
      required: true
